services:
  - type: web
    name: docmind-ai
    runtime: python
    region: singapore
    plan: free
    # rootDir: .  # Set to . by default if not specified
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
